apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/stolostron/installer-ai-dev?rev={{revision}}&commit_sha={{revision}}&pull_request_number={{pull_request_number}}&target_branch={{target_branch}}
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "master"
  labels:
    appstudio.openshift.io/application: agent-runners
    appstudio.openshift.io/component: installer-ai-dev
    pipelines.appstudio.openshift.io/type: build
  name: installer-ai-dev-agent-runners-on-push
  namespace: crt-redhat-acm-tenant
spec:
  params:
    - name: git-url
      value: '{{source_url}}'
    - name: revision
      value: '{{revision}}'
    - name: output-image
      value: quay.io/redhat-user-workloads/crt-redhat-acm-tenant/installer-ai-dev:{{revision}}
    - name: build-platforms
      value:
        - linux/x86_64
    - name: dockerfile
      value: dev-bot/Dockerfile.runner
    - name: build-source-image
      value: "true"
    - name: hermetic
      value: "true"
    - name: path-context
      value: .
    - name: send-slack-notification
      value: "true"
    - name: konflux-application-name
      value: agent-runners
    - name: slack-member-id
      value: UU77A0LC8
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/stolostron/konflux-build-catalog.git
      - name: revision
        value: main
      - name: pathInRepo
        value: pipelines/common.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-installer-ai-dev
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
