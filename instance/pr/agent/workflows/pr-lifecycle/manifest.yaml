name: pr-lifecycle
type: workflow
description: Post-PR lifecycle — CI, conflicts, review feedback, QE handoff, merge wrap-up

preflight:
  - 01-find-review-candidates.py
  - 02-gh-pr-status.py

shared_skills:
  - push-and-pr
  - post-pr

provides:
  claude_md: CLAUDE.md
  skills:
    - wrap-up
    - qe-handoff

requires:
  mcp_servers:
    - bot-memory
    - mcp-atlassian
  env_vars:
    - BOT_LABEL
    - BOT_INSTANCE_ID
    - BOT_JIRA_EMAIL
  optional_env_vars:
    - BOT_CONFIG_REPO
    - SLACK_WEBHOOK_URL
